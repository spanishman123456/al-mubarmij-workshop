# Render Blueprint — SPA + Analytics API (Node/Express)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: al-mubarmij-workshop
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: analytics-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
