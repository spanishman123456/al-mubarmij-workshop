# Render Blueprint — Static SPA + Docker API
services:
  - type: web
    name: al-mubarmij-workshop
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://al-mubarmij-workshop-server.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: al-mubarmij-workshop-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
