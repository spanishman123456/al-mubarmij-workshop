# Render Blueprint — Node API + Vite SPA
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: al-mubarmij-workshop
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/sessions.db
    disk:
      name: session-data
      mountPath: /var/data
      sizeGB: 1
