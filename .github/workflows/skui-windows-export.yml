name: Build SKUI Windows export

on:
  workflow_dispatch:
    inputs:
      product_name:
        description: Windows application display name
        required: true
        default: SKUI Project
        type: string
      version:
        description: SemVer application version
        required: true
        default: 0.1.0
        type: string
      identifier:
        description: Reverse-domain application identifier
        required: true
        default: org.mubarmij.skui.project
        type: string
      dist_path:
        description: Repository-relative directory containing index.html and local assets
        required: true
        default: desktop/skui-tauri-template/dist
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TEMPLATE_DIR: desktop/skui-tauri-template
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate inputs and prepare embedded assets
        shell: pwsh
        env:
          INPUT_PRODUCT_NAME: ${{ inputs.product_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_IDENTIFIER: ${{ inputs.identifier }}
          INPUT_DIST_PATH: ${{ inputs.dist_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "version must be SemVer (for example 1.2.3)"
          }
          if ($env:INPUT_IDENTIFIER -notmatch '^[A-Za-z0-9.-]+$' -or $env:INPUT_IDENTIFIER -notmatch '\.') {
            throw "identifier must be a reverse-domain identifier"
          }

          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $source = [IO.Path]::GetFullPath((Join-Path $workspace $env:INPUT_DIST_PATH))
          if (-not $source.StartsWith($workspace + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw "dist_path must remain inside the checked-out repository"
          }
          if (-not (Test-Path (Join-Path $source "index.html") -PathType Leaf)) {
            throw "dist_path must contain index.html"
          }

          $target = [IO.Path]::GetFullPath((Join-Path $workspace "$env:TEMPLATE_DIR/dist"))
          if ($source -ne $target) {
            Remove-Item $target -Recurse -Force
            New-Item $target -ItemType Directory | Out-Null
            Copy-Item (Join-Path $source "*") $target -Recurse -Force
          }

          $configPath = Join-Path $workspace "$env:TEMPLATE_DIR/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.productName = $env:INPUT_PRODUCT_NAME
          $config.version = $env:INPUT_VERSION
          $config.identifier = $env:INPUT_IDENTIFIER
          $config.app.windows[0].title = $env:INPUT_PRODUCT_NAME
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/skui-tauri-template/src-tauri

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build NSIS and MSI bundles
        shell: pwsh
        working-directory: desktop/skui-tauri-template/src-tauri
        run: cargo tauri build --bundles nsis,msi

      - name: Sign and verify Windows installers when configured
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Configure both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD, or neither."
          }
          if (-not $hasCertificate) {
            Write-Host "Authenticode signing not configured; installers remain unsigned."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          try {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -File -Recurse |
              Where-Object FullName -Match '\\x64\\signtool\.exe$' |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw "signtool.exe (x64) was not found"
            }

            $bundleRoot = Join-Path $env:GITHUB_WORKSPACE "$env:TEMPLATE_DIR/src-tauri/target/release/bundle"
            $installers = @(Get-ChildItem $bundleRoot -File -Recurse |
              Where-Object Extension -In ".exe", ".msi")
            if ($installers.Count -eq 0) {
              throw "No Windows installers were produced"
            }
            foreach ($installer in $installers) {
              & $signTool.FullName sign /fd SHA256 /f $certificatePath `
                /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($installer.Name)" }
              & $signTool.FullName verify /pa /all $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $($installer.Name)" }
            }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Collect installers and SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE "$env:TEMPLATE_DIR/src-tauri/target/release/bundle"
          $output = Join-Path $env:GITHUB_WORKSPACE "windows-artifacts"
          New-Item $output -ItemType Directory -Force | Out-Null
          $installers = @(Get-ChildItem $bundleRoot -File -Recurse |
            Where-Object Extension -In ".exe", ".msi")
          if ($installers.Count -lt 2) {
            throw "Expected both NSIS (.exe) and MSI (.msi) installers"
          }
          foreach ($installer in $installers) {
            Copy-Item $installer.FullName (Join-Path $output $installer.Name)
          }
          Get-ChildItem $output -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
            } |
            Set-Content (Join-Path $output "SHA256SUMS.txt") -Encoding ascii

      - name: Upload Windows installers and checksums
        uses: actions/upload-artifact@v4
        with:
          name: skui-windows-${{ inputs.version }}
          path: windows-artifacts/*
          if-no-files-found: error
          retention-days: 14
