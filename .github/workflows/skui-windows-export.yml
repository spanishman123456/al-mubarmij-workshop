name: Build SKUI Windows export

on:
  push:
    branches:
      - cursor/skui-export-platform-edf1
    paths:
      - ".github/workflows/skui-windows-export.yml"
      - "desktop/skui-tauri-template/**"
  workflow_dispatch:
    inputs:
      product_name:
        description: Windows application display name
        required: true
        default: SKUI Project
        type: string
      version:
        description: SemVer application version
        required: true
        default: 0.1.0
        type: string
      identifier:
        description: Reverse-domain application identifier
        required: true
        default: org.mubarmij.skui.project
        type: string
      dist_path:
        description: Repository-relative directory containing index.html and local assets
        required: true
        default: desktop/skui-tauri-template/dist
        type: string
      build_id:
        description: Server export job ID (empty for repository smoke build)
        required: false
        default: ""
        type: string
      api_base:
        description: HTTPS platform base URL for the build worker
        required: false
        default: ""
        type: string
      build_token:
        description: Single-use build capability supplied by the platform
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TEMPLATE_DIR: desktop/skui-tauri-template
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate inputs and prepare embedded assets
        shell: pwsh
        env:
          INPUT_PRODUCT_NAME: ${{ inputs.product_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_IDENTIFIER: ${{ inputs.identifier }}
          INPUT_DIST_PATH: ${{ inputs.dist_path }}
          INPUT_BUILD_ID: ${{ inputs.build_id }}
          INPUT_API_BASE: ${{ inputs.api_base }}
          INPUT_BUILD_TOKEN: ${{ inputs.build_token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:INPUT_PRODUCT_NAME)) { $env:INPUT_PRODUCT_NAME = "SKUI Project" }
          if ([string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) { $env:INPUT_VERSION = "1.0.0" }
          if ([string]::IsNullOrWhiteSpace($env:INPUT_IDENTIFIER)) { $env:INPUT_IDENTIFIER = "org.mubarmij.skui.project" }
          if ([string]::IsNullOrWhiteSpace($env:INPUT_DIST_PATH)) { $env:INPUT_DIST_PATH = "desktop/skui-tauri-template/dist" }
          "PRODUCT_VERSION=$env:INPUT_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_BUILD_TOKEN)) {
            Write-Output "::add-mask::$env:INPUT_BUILD_TOKEN"
          }
          if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "version must be SemVer (for example 1.2.3)"
          }
          if ($env:INPUT_IDENTIFIER -notmatch '^[A-Za-z0-9.-]+$' -or $env:INPUT_IDENTIFIER -notmatch '\.') {
            throw "identifier must be a reverse-domain identifier"
          }

          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_BUILD_ID)) {
            if ($env:INPUT_API_BASE -notmatch '^https://') { throw "api_base must use HTTPS" }
            if ([string]::IsNullOrWhiteSpace($env:INPUT_BUILD_TOKEN)) { throw "build_token is required with build_id" }
            $sourceZip = Join-Path $env:RUNNER_TEMP "skui-source.zip"
            $expanded = Join-Path $env:RUNNER_TEMP "skui-source"
            Invoke-WebRequest `
              -Uri "$($env:INPUT_API_BASE.TrimEnd('/'))/api/exports/$env:INPUT_BUILD_ID/source" `
              -Headers @{ "x-export-build-token" = $env:INPUT_BUILD_TOKEN } `
              -OutFile $sourceZip
            Expand-Archive -Path $sourceZip -DestinationPath $expanded -Force
            $index = Get-ChildItem $expanded -Filter index.html -File -Recurse | Select-Object -First 1
            if (-not $index) { throw "Downloaded WebApp bundle does not contain index.html" }
            $source = $index.Directory.FullName
          } else {
            $source = [IO.Path]::GetFullPath((Join-Path $workspace $env:INPUT_DIST_PATH))
            if (-not $source.StartsWith($workspace + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
              throw "dist_path must remain inside the checked-out repository"
            }
          }
          if (-not (Test-Path (Join-Path $source "index.html") -PathType Leaf)) {
            throw "dist_path must contain index.html"
          }

          $target = [IO.Path]::GetFullPath((Join-Path $workspace "$env:TEMPLATE_DIR/dist"))
          if ($source -ne $target) {
            Remove-Item $target -Recurse -Force
            New-Item $target -ItemType Directory | Out-Null
            Copy-Item (Join-Path $source "*") $target -Recurse -Force
          }

          $configPath = Join-Path $workspace "$env:TEMPLATE_DIR/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.productName = $env:INPUT_PRODUCT_NAME
          $config.version = $env:INPUT_VERSION
          $config.identifier = $env:INPUT_IDENTIFIER
          $config.app.windows[0].title = $env:INPUT_PRODUCT_NAME
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/skui-tauri-template/src-tauri

      - name: Install Tauri CLI
        shell: pwsh
        run: npm install --global @tauri-apps/cli@latest

      - name: Build NSIS and MSI bundles
        shell: pwsh
        working-directory: desktop/skui-tauri-template/src-tauri
        run: tauri build --bundles "nsis,msi"

      - name: Sign and verify Windows installers when configured
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "Configure both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD, or neither."
          }
          if (-not $hasCertificate) {
            Write-Host "Authenticode signing not configured; installers remain unsigned."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          try {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -File -Recurse |
              Where-Object FullName -Match '\\x64\\signtool\.exe$' |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw "signtool.exe (x64) was not found"
            }

            $bundleRoot = Join-Path $env:GITHUB_WORKSPACE "$env:TEMPLATE_DIR/src-tauri/target/release/bundle"
            $installers = @(Get-ChildItem $bundleRoot -File -Recurse |
              Where-Object Extension -In ".exe", ".msi")
            if ($installers.Count -eq 0) {
              throw "No Windows installers were produced"
            }
            foreach ($installer in $installers) {
              & $signTool.FullName sign /fd SHA256 /f $certificatePath `
                /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($installer.Name)" }
              & $signTool.FullName verify /pa /all $installer.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $($installer.Name)" }
              $signature = Get-AuthenticodeSignature $installer.FullName
              if ($signature.Status -ne "Valid") { throw "Authenticode status is $($signature.Status): $($installer.Name)" }
            }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Collect installers and SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE "$env:TEMPLATE_DIR/src-tauri/target/release/bundle"
          $output = Join-Path $env:GITHUB_WORKSPACE "windows-artifacts"
          New-Item $output -ItemType Directory -Force | Out-Null
          $installers = @(Get-ChildItem $bundleRoot -File -Recurse |
            Where-Object Extension -In ".exe", ".msi")
          if ($installers.Count -lt 2) {
            throw "Expected both NSIS (.exe) and MSI (.msi) installers"
          }
          foreach ($installer in $installers) {
            Copy-Item $installer.FullName (Join-Path $output $installer.Name)
          }
          Get-ChildItem $output -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
            } |
            Set-Content (Join-Path $output "SHA256SUMS.txt") -Encoding ascii

      - name: Upload Windows installers and checksums
        uses: actions/upload-artifact@v4
        with:
          name: skui-windows-${{ env.PRODUCT_VERSION }}
          path: windows-artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Return installers to platform job
        if: ${{ inputs.build_id != '' }}
        shell: pwsh
        env:
          INPUT_BUILD_ID: ${{ inputs.build_id }}
          INPUT_API_BASE: ${{ inputs.api_base }}
          INPUT_BUILD_TOKEN: ${{ inputs.build_token }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Output "::add-mask::$env:INPUT_BUILD_TOKEN"
          $archive = Join-Path $env:RUNNER_TEMP "skui-windows-installers.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE/windows-artifacts/*" -DestinationPath $archive -Force
          Invoke-WebRequest `
            -Method Put `
            -Uri "$($env:INPUT_API_BASE.TrimEnd('/'))/api/exports/$env:INPUT_BUILD_ID/result" `
            -Headers @{
              "x-export-build-token" = $env:INPUT_BUILD_TOKEN
              "x-export-filename" = "skui-windows-installers.zip"
              "x-export-content-type" = "application/zip"
            } `
            -ContentType "application/octet-stream" `
            -InFile $archive

      - name: Report failed build to platform
        if: ${{ failure() && inputs.build_id != '' }}
        shell: pwsh
        env:
          INPUT_BUILD_ID: ${{ inputs.build_id }}
          INPUT_API_BASE: ${{ inputs.api_base }}
          INPUT_BUILD_TOKEN: ${{ inputs.build_token }}
        run: |
          Write-Output "::add-mask::$env:INPUT_BUILD_TOKEN"
          $body = @{ status = "failed"; error = "Windows Tauri build failed. Review the GitHub Actions log." } | ConvertTo-Json
          try {
            Invoke-RestMethod `
              -Method Post `
              -Uri "$($env:INPUT_API_BASE.TrimEnd('/'))/api/exports/$env:INPUT_BUILD_ID/result" `
              -Headers @{ "x-export-build-token" = $env:INPUT_BUILD_TOKEN } `
              -ContentType "application/json" `
              -Body $body
          } catch {
            Write-Warning "Could not report build failure: $($_.Exception.Message)"
          }
